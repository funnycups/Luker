<div class="userSyncS3 flex-container flexFlowColumn flexGap10">
    <h3></h3>
    <div class="syncS3CommonFields">
        <label><span data-i18n="Backend label">Backend label</span><input class="text_pole syncS3Label" autocomplete="off"></label>
        <div data-i18n="Categories to sync:">Categories to sync:</div>
        <div class="syncS3CategoryGrid flex-container flexWrap flexGap10"></div>
    </div>
    <div class="syncS3ConnectionFields">
        <label><span data-i18n="S3 endpoint">S3 endpoint</span><input class="text_pole syncS3Endpoint" placeholder="https://s3.example.com" autocomplete="off"></label>
        <label><span data-i18n="Region">Region</span><select class="text_pole syncS3Region"></select></label>
        <label><span data-i18n="Bucket">Bucket</span><input class="text_pole syncS3Bucket" autocomplete="off"></label>
        <label><span data-i18n="Prefix">Prefix</span><input class="text_pole syncS3Prefix" autocomplete="off"></label>
        <label class="checkbox_label"><input type="checkbox" class="syncS3ForcePathStyle"><span data-i18n="Use path-style requests">Use path-style requests</span></label>
        <label class="checkbox_label"><input type="checkbox" class="syncS3StripIfMatchQuotes"><span data-i18n="Send ETag without quotes">Send ETag without quotes</span></label>
        <label><span data-i18n="Access key ID">Access key ID</span><input type="password" class="text_pole syncS3AccessKeyId" autocomplete="new-password"></label>
        <label><span data-i18n="Secret access key">Secret access key</span><input type="password" class="text_pole syncS3SecretAccessKey" autocomplete="new-password"></label>
    </div>
    <label class="syncS3PassphraseField"><span data-i18n="Encryption passphrase">Encryption passphrase</span><input type="password" class="text_pole syncS3Passphrase" autocomplete="new-password"></label>
    <div class="syncS3RetentionNote menu_button_note" data-i18n="Leave credentials and passphrase blank to keep the stored values. Bucket and prefix cannot be changed; remove and add the backend instead.">Leave credentials and passphrase blank to keep the stored values. Bucket and prefix cannot be changed; remove and add the backend instead.</div>
    <div class="syncS3Error displayNone"></div>
    <button type="button" class="syncS3SaveButton menu_button" data-i18n="Save">Save</button>
</div>
