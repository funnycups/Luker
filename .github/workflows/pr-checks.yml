name: ✅ Pull Request Checks

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: pr-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  run-eslint:
    name: ✅ Lint & Boundary Checks on PR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install root dependencies
        run: npm ci --ignore-scripts

      - name: Run ESLint
        run: npm run lint

      - name: Check plugin import boundaries
        run: npm run lint:plugin-imports

      - name: Check test resource ownership boundaries
        run: npm run lint:test-ownership

  run-tests:
    name: ✅ Run Unit & Local Storage Tests on PR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            tests/package-lock.json

      - name: Install root dependencies
        run: npm ci --ignore-scripts

      - name: Install test dependencies
        run: npm ci --ignore-scripts --prefix tests

      - name: Build SQLite native dependency
        run: npm run storage:install-sqlite

      - name: Run managed Jest unit tests
        run: node tests/harness/run.js --profile unit --framework jest -- --maxWorkers=3

      - name: Run managed local storage tests
        run: npm run test:storage:local --prefix tests -- --maxWorkers=3

      - name: Run native harness lifecycle tests
        working-directory: tests
        run: node --test harness/resource-scope.test.mjs harness/resource-recovery.test.mjs harness/diagnostic-retention.test.mjs harness/seed-and-profiles.test.mjs harness/jest-lifecycle.test.mjs harness/entrypoints.test.mjs

  run-storage-sql:
    name: ✅ Run SQL Storage Integration Tests on PR
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_ROOT_HOST: '%'
        ports:
          - 53306:3306
        options: >-
          --tmpfs /var/lib/mysql:rw,size=1g
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=15
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: luker
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: luker_test
          POSTGRES_INITDB_ARGS: '--nosync'
        ports:
          - 55432:5432
        options: >-
          --tmpfs /var/lib/postgresql/data:rw,size=512m
          --health-cmd="pg_isready -h 127.0.0.1 -U luker -d luker_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=15
      rustfs:
        image: rustfs/rustfs@sha256:1803faef57627e2d9c2e7d89d655d712ddded5389040054987163043fecb6a3c
        env:
          RUSTFS_ACCESS_KEY: luker-test
          RUSTFS_SECRET_KEY: luker-test-secret
        ports:
          - 19000:9000

    env:
      LUKER_TEST_MYSQL_ROOT_URL: mysql://root:root@127.0.0.1:53306
      LUKER_TEST_POSTGRES_URL: postgresql://luker:postgres@127.0.0.1:55432/luker_test
      LUKER_TEST_RUSTFS_ENDPOINT: http://127.0.0.1:19000

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            tests/package-lock.json

      - name: Install root dependencies
        run: npm ci --ignore-scripts

      - name: Install test dependencies
        run: npm ci --ignore-scripts --prefix tests

      - name: Build SQLite native dependency
        run: npm run storage:install-sqlite

      - name: Wait for RustFS service
        run: |
          node -e '
            const deadline = Date.now() + 60_000;
            (async () => {
              while (Date.now() < deadline) {
                try {
                  const res = await fetch(process.env.LUKER_TEST_RUSTFS_ENDPOINT + "/");
                  if (res.status === 403 || res.status === 200) process.exit(0);
                } catch {}
                await new Promise(r => setTimeout(r, 500));
              }
              console.error("RustFS did not become ready within 60s");
              process.exit(1);
            })();
          '

      - name: Run managed SQL storage tests with database preflight
        # The DB fixtures share one MySQL/Postgres service; tmpfs keeps DDL in
        # memory, while bounding workers avoids connection/lock spikes.
        run: npm run test:storage:sql --prefix tests

  run-browser-harness:
    name: ✅ Run Browser & Observation Harness Tests on PR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            tests/package-lock.json

      - name: Install root dependencies
        run: npm ci --ignore-scripts

      - name: Install test dependencies
        run: npm ci --ignore-scripts --prefix tests

      - name: Install Chromium for Playwright
        run: npx --prefix tests playwright install --with-deps chromium

      - name: Run browser lifecycle and operation observation suites
        run: node tests/harness/run.js --profile unit --file tests/harness/browser-lifecycle.test.mjs --file tests/harness/operation-observation.test.mjs
